name: Build QingXiang TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".qingxiang/qingxiang-build.patch.gz.b64"
      - ".github/workflows/qingxiang-build.yml"

permissions:
  contents: read

concurrency:
  group: qingxiang-tv-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java32-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Q215 fork
        uses: actions/checkout@v4

      - name: Apply QingXiang patch
        shell: bash
        run: |
          base64 --decode .qingxiang/qingxiang-build.patch.gz.b64 | gzip --decompress > /tmp/qingxiang-build.patch
          git apply --check /tmp/qingxiang-build.patch
          git apply /tmp/qingxiang-build.patch
          chmod +x gradlew

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 33
        shell: bash
        run: sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Build WE30 Pro 32-bit APK
        shell: bash
        run: ./gradlew :app:assembleJava32Debug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QingXiangTV-WE30Pro-java32-v0.3.1
          path: app/build/outputs/apk/java32/debug/*.apk
          if-no-files-found: error
          retention-days: 14
